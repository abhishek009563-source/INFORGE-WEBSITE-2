<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Client Leads & Email Inbox — Abhishek's Agency</title>

  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&family=Space+Grotesk:wght@500;700&display=swap" rel="stylesheet">
  
  <!-- Material Symbols -->
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" rel="stylesheet" />

  <style>
    :root {
      --bg-dark: #070b14;
      --card-bg: rgba(15, 23, 42, 0.75);
      --card-border: rgba(255, 255, 255, 0.1);
      --accent-blue: #38bdf8;
      --accent-green: #22c55e;
      --accent-red: #ef4444;
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      --font-main: 'Outfit', sans-serif;
      --font-heading: 'Space Grotesk', sans-serif;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background-color: var(--bg-dark);
      font-family: var(--font-main);
      color: var(--text-main);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    .container {
      max-width: 1100px;
      margin: 0 auto;
      padding: 24px;
      width: 100%;
    }

    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: var(--card-bg);
      backdrop-filter: blur(16px);
      border: 1px solid var(--card-border);
      border-radius: 20px;
      padding: 20px 28px;
      margin-bottom: 24px;
    }

    .brand { display: flex; align-items: center; gap: 12px; }
    .brand-icon { font-size: 36px; color: var(--accent-blue); }
    .brand h1 { font-family: var(--font-heading); font-size: 24px; }

    .email-badge {
      background: rgba(56, 189, 248, 0.12);
      border: 1px solid var(--accent-blue);
      color: var(--accent-blue);
      padding: 8px 18px;
      border-radius: 20px;
      font-size: 14px;
      font-weight: 700;
    }

    .leads-card {
      background: var(--card-bg);
      backdrop-filter: blur(20px);
      border: 1px solid var(--card-border);
      border-radius: 24px;
      padding: 28px;
    }

    .leads-list {
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .lead-item {
      background: rgba(255, 255, 255, 0.03);
      border: 1px solid var(--card-border);
      border-radius: 16px;
      padding: 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 20px;
    }

    .lead-name { font-size: 18px; font-weight: 700; color: white; }
    .lead-meta { font-size: 13px; color: var(--text-muted); margin-top: 4px; }
    .lead-msg { font-size: 14px; color: #e2e8f0; margin-top: 8px; background: rgba(0,0,0,0.4); padding: 10px 14px; border-radius: 10px; }

    .btn-reply-wa {
      background: #25d366;
      color: white;
      border: none;
      padding: 10px 18px;
      border-radius: 12px;
      font-weight: 700;
      font-size: 13px;
      cursor: pointer;
      text-decoration: none;
      display: flex;
      align-items: center;
      gap: 6px;
    }
  </style>
</head>
<body>

  <div class="container">
    <header class="header">
      <div class="brand">
        <span class="material-symbols-outlined brand-icon">mark_email_unread</span>
        <div>
          <h1>Client Lead Inbox</h1>
          <p>Real-Time Website Enquiries & Client Submissions</p>
        </div>
      </div>
      <div class="email-badge">
        📧 abhishek009563@gmail.com
      </div>
    </header>

    <div class="leads-card">
      <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px;">
        <h3 style="font-family: var(--font-heading); font-size: 20px;">Received Client Enquiries</h3>
        <button class="btn-reply-wa" style="background: rgba(56, 189, 248, 0.15); color: var(--accent-blue);" onclick="loadLeads()">
          <span class="material-symbols-outlined">refresh</span> Refresh Inbox
        </button>
      </div>

      <div id="leads-container" class="leads-list">
        <!-- Dynamically Rendered -->
      </div>
    </div>
  </div>

  <script>
    async function loadLeads() {
      const container = document.getElementById('leads-container');
      try {
        const res = await fetch('/api/leads');
        const leads = await res.json();

        if (!leads || leads.length === 0) {
          container.innerHTML = `<div style="text-align: center; padding: 40px; color: var(--text-muted);">No client form submissions received yet. Submissions from Ironforge Gym, Hairable Salon, & AK Dhaba will appear here live!</div>`;
          return;
        }

        container.innerHTML = leads.map(l => `
          <div class="lead-item">
            <div style="flex-grow: 1;">
              <div class="lead-name">${l.name} <span style="font-size: 12px; font-weight: 400; color: var(--accent-blue);">[From: ${l.source || 'Website Form'}]</span></div>
              <div class="lead-meta">📞 Phone: <strong>${l.phone}</strong> | 📧 Email: <strong>${l.email}</strong> | ⏰ ${new Date(l.date).toLocaleString()}</div>
              <div class="lead-msg">${l.message || 'No extra notes.'}</div>
            </div>
            <div>
              <a href="https://wa.me/${l.phone.replace(/[^0-9]/g, '')}?text=Hi%20${encodeURIComponent(l.name)},%20I%20received%20your%20website%20enquiry!" target="_blank" class="btn-reply-wa">
                <span class="material-symbols-outlined">chat</span> Reply WhatsApp
              </a>
            </div>
          </div>
        `).join('');
      } catch (err) {
        container.innerHTML = `<div style="color: var(--accent-red);">Error loading leads inbox.</div>`;
      }
    }

    window.addEventListener('DOMContentLoaded', loadLeads);
  </script>
</body>
</html>
